services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hsa
      POSTGRES_USER: hsa
      POSTGRES_PASSWORD: hsa
    ports: ["5432:5432"]
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsa -d hsa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://hsa:hsa@db:5432/hsa
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      db: { condition: service_healthy }

  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: hsa
      SEED_DATA: ${SEED_DATA:-true}
    volumes:
      - ./backend/seed.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'if [ "$$SEED_DATA" = "true" ]; then psql -h db -U hsa -d hsa -f /seed.sql; else echo "Seed data disabled"; fi'
    depends_on:
      db: { condition: service_healthy }

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

volumes:
  postgres_dev_data:
  frontend_node_modules:
