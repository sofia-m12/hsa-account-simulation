services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hsa
      POSTGRES_USER: hsa
      POSTGRES_PASSWORD: hsa
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsa -d hsa"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hsa:hsa@db:5432/hsa
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
